name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean packaging/afing.spec
      - name: Smoke test the exe
        run: |
          dist\afing.exe --version
          dist\afing.exe scan
      - uses: actions/upload-artifact@v4
        with:
          name: afing-windows
          path: dist/afing.exe
